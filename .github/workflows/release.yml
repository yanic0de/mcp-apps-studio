name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Nothing is published unless the same checks as CI pass on this exact commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm smoke:pack
      # Opens a "Version packages" PR from pending changesets; publishes when that PR is merged.
      # v1 pairs with @changesets/cli 2.x (action v2 requires CLI v3); v1.9.0 already runs on Node 24.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: pnpm release
          version: pnpm changeset version
        # No npm token: the action detects OIDC and pnpm exchanges it for a short-lived publish credential
        # (npm Trusted Publishing, configured per package on npmjs.com); provenance comes with it.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the action and @changesets/changelog-github
      # Users pin the GitHub Action to the major tag (`yanic0de/mcp-apps-studio@v0`): move it to this release.
      - name: Move the major tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          major="v$(node -p "require('./packages/cli/package.json').version.split('.')[0]")"
          git tag -f "$major"
          git push -f origin "$major"
